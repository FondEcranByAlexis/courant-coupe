<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141714">
<title>Courant Coupé — FBA Games</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;--yellow:#ffca62;--ink:#151715;--border:#ffffff26}
*{box-sizing:border-box}
body{margin:0;background:#22241f;color:#faf2e5;overflow:hidden}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;border:1px solid var(--border);border-radius:9px;padding:.72rem 1rem;background:#2b3029;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.primary{background:var(--yellow);color:#211a0e;font-weight:800;border-color:transparent}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:1rem;background:#0c110eb5}
.panel{width:min(100%,33rem);max-height:100%;overflow:auto;background:#191e19;border:1px solid var(--border);border-radius:16px;padding:clamp(1.2rem,4vw,2.5rem);box-shadow:0 24px 80px #0008}
.brand{font-size:.78rem;font-weight:800;letter-spacing:.23em;color:var(--yellow);text-transform:uppercase}
h1,h2{line-height:1.02;margin:.6rem 0}
h1{font-size:clamp(2.7rem,9vw,5rem);letter-spacing:-.075em}
h2{font-size:clamp(1.55rem,5vw,2.5rem);letter-spacing:-.04em}
p{line-height:1.5;color:#ded9cc}
small{display:block;color:#bdbdae;line-height:1.45;margin-top:1rem}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:max(.7rem,env(safe-area-inset-top));left:.75rem;right:.75rem;display:flex;justify-content:space-between;align-items:start;gap:.5rem}
#brief,#help,#action,#stick,#compass{background:#151914ec;border:1px solid var(--border);border-radius:10px}
#brief{padding:.65rem .8rem;max-width:28rem}
#goal{display:block;margin-top:.27rem;font-size:clamp(.83rem,2.5vw,1rem)}
#help,#action,#stick,#missionsButton,#soundButton{pointer-events:auto}
#help,#missionsButton,#soundButton{padding:.52rem .7rem}
#soundButton[aria-pressed=false]{opacity:.65}
#toolbar{display:flex;gap:.4rem}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border:1px solid #fff;border-radius:50%;box-shadow:0 0 5px #000}
#action{position:absolute;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;background:#222419;padding:.68rem .9rem}
#action:disabled{opacity:.7;cursor:default}
#stick{display:none;position:absolute;bottom:max(1rem,env(safe-area-inset-bottom));left:1rem;width:76px;height:76px;border-radius:50%;touch-action:none}
#thumb{position:absolute;top:50%;left:50%;width:32px;height:32px;margin:-16px;border-radius:50%;background:var(--yellow);pointer-events:none}
#compass{position:absolute;bottom:4.4rem;left:50%;transform:translateX(-50%);padding:.28rem .55rem;font-size:.77rem;white-space:nowrap}
#choices{display:grid;gap:.5rem}
#choices button{text-align:left}
#diagnostic{display:grid;gap:.6rem;margin:.65rem 0}
#meterControls{display:flex;align-items:center;flex-wrap:wrap;gap:.55rem}
#meterMode[aria-pressed=true]{border-color:var(--yellow);color:var(--yellow)}
#meterDisplay{padding:.55rem .65rem;border:1px solid #66795f;border-radius:6px;background:#182618;color:#c7e9a6;font-family:monospace;font-size:1rem}
#circuitRows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.circuit-card{display:grid;align-content:start;gap:.4rem;padding:.55rem;background:linear-gradient(#363e38,#252c27);border:1px solid #677369;border-radius:8px}
.circuit-card strong{font-size:.82rem}
.circuit-card button{min-height:44px;padding:.35rem;font-size:.79rem;overflow-wrap:anywhere}
.circuit-light{display:inline-block;width:11px;height:11px;margin-right:.32rem;border-radius:50%;background:#9ed29e;box-shadow:0 0 7px #9ed29e70}
.circuit-light.trip{background:#ef9663;box-shadow:0 0 7px #ef966370}
.circuit-card small{margin:0;font-size:.76rem}
#diagnostic details{border:1px solid #566359;border-radius:6px;padding:.45rem .55rem}
#diagnostic summary{cursor:pointer;color:#f1d896;font-weight:650}
#notebook ul{padding-left:1.25rem;margin:.4rem 0}
#notebook li{margin:.28rem 0}
#notebook p{margin:.35rem 0}
@media(max-width:390px) and (orientation:portrait){#circuitRows{grid-template-columns:1fr}}
#diagnostic .probe-tray,#diagnostic .test-pair{display:flex;gap:.35rem;flex-wrap:wrap}
#diagnostic .probe{min-height:44px;touch-action:none;cursor:grab;padding:.35rem .55rem}
.probe.black{background:#171b19}.probe.red{background:#713b36}
#probeTip{position:fixed;z-index:12;pointer-events:none;width:10px;height:34px;border:1px solid #d6dcd5;border-radius:5px 5px 2px 2px;transform:translate(-50%,-100%);background:#191e1a}
#probeTip.red{background:#b54f44}
.probe[aria-pressed=true]{outline:2px solid var(--yellow)}
.test-pair button{flex:1;border-radius:50px;background:#202522}
.test-pair button[data-probe=black]{box-shadow:inset 0 0 0 2px #aeb9af;background:#121514}
.test-pair button[data-probe=red]{box-shadow:inset 0 0 0 2px #ed8e7c;background:#713b36}
#circuitRows{gap:.22rem;padding:.7rem .5rem;background:linear-gradient(#2c332e 12%,#151a17 12% 36%,#8e9791 36% 57%,#202622 57%);border:4px solid #4c5550;border-radius:8px;box-shadow:inset 0 3px 10px #0009}
.circuit-card{gap:.35rem;padding:.42rem;background:linear-gradient(135deg,#eeede4,#d8dacf);color:#202621;border:1px solid #a7aca1;border-radius:3px;box-shadow:0 3px 4px #0009,inset 0 1px #fff}
.circuit-card strong{background:#f7f4e7;padding:.2rem .25rem;border:1px solid #b4b6a8;border-radius:2px;color:#202621}
.circuit-card small{color:#29352c;font-weight:650}
#diagnostic .breaker-lever{--travel:var(--rest,0%);position:relative;min-height:72px;padding:0;touch-action:none;background:linear-gradient(90deg,#b6bab0,#dadbd2 20% 80%,#acb1a7);border:1px solid #92988d;border-radius:3px;box-shadow:inset 0 1px 3px #343b3655}
#diagnostic .breaker-lever:disabled{opacity:1;cursor:default}
.breaker-lever[data-state=on]{--rest:0%}
.breaker-lever[data-state=trip]{--rest:30%}
.breaker-lever[data-state=off]{--rest:60%}
.breaker-lever::before,.breaker-lever::after{position:absolute;left:7%;font:700 .68rem monospace;color:#333c34}
.breaker-lever::before{content:'I';top:11%}
.breaker-lever::after{content:'O';bottom:10%}
.breaker-slot{position:absolute;inset:8% 22%;background:#1a201c;border-radius:3px;box-shadow:inset 0 3px 5px #000b;pointer-events:none}
.breaker-thumb{position:absolute;left:9%;right:9%;height:40%;top:var(--travel);border-radius:3px;background:linear-gradient(#69736c,#333b36 23%,#181e1a 78%);border:1px solid #101511;box-shadow:0 3px 4px #0009,inset 0 2px #a0a79e77;transition:top .16s ease-out}
.breaker-thumb::after{content:'';position:absolute;inset:37% 16%;background:repeating-linear-gradient(#939b91 0 1px,#343c36 1px 3px)}
.breaker-lever[data-dragging=true] .breaker-thumb{transition:none}
.circuit-light.off{background:#788278;box-shadow:none}
#diagnostic .test-pair{padding:.15rem .1rem;background:#414a43;border-radius:4px}
@media(prefers-reduced-motion:reduce){.breaker-thumb{transition:none}}
#workbench{display:grid;gap:.55rem;margin:.65rem 0}
#toolbox{display:flex;flex-wrap:wrap;gap:.4rem}
#toolbox button{font-size:.86rem;padding:.5rem .65rem;min-height:44px}
#toolbox button[aria-pressed=true]{border-color:var(--yellow);color:var(--yellow);background:#473920}
#repairScene{position:relative;isolation:isolate;min-height:174px;overflow:hidden;border:1px solid #758078;border-radius:10px;background:linear-gradient(145deg,#3c4542,#222926);box-shadow:inset 0 0 24px #111a}
#repairScene button{position:absolute;display:grid;place-items:center;padding:0;min-width:44px;min-height:44px;touch-action:manipulation}
#repairScene button:not(:disabled):hover,#repairScene button:focus-visible{outline:2px solid var(--yellow);outline-offset:-2px}
#repairScene button:disabled{cursor:default}
#cover{z-index:2;inset:9% 14%;width:72%;background:repeating-linear-gradient(0deg,#59625d 0 2px,#5f6963 2px 4px);border:2px solid #a6ada7;box-shadow:0 4px 12px #1218}
#cover.cover-open{inset:9% 4%;width:15%;background:#48514b;box-shadow:3px 0 10px #1118;writing-mode:vertical-rl;animation:open-cover .25s ease-out}
@keyframes open-cover{from{width:72%;left:14%}}
#component{inset:24% 23% 24% 27%;background:repeating-linear-gradient(90deg,#4b4b3a 0 5px,#393d33 5px 10px);border:2px solid #9a9a79}
#component.loose-connector{inset:22% 3% 22% auto;width:19%;font-size:.75rem}
#component.empty{background:#1c2320;border:2px dashed #b1b78c}
#component.new{background:repeating-linear-gradient(90deg,#607564 0 5px,#465d4d 5px 10px);border-color:#b9d1af}
#spare{z-index:1;bottom:4%;right:3%;width:28%;background:#57452a;border:1px solid #e0be70;font-size:.8rem}
#spare[aria-pressed=true]{background:var(--yellow);color:#211a0e}
.fastener{z-index:3;background:#1c241db5;border:1px solid #b3ad88;border-radius:50%;transform:translate(-50%,-50%)}
.fastener::before{content:'';width:23px;height:23px;border-radius:50%;background:linear-gradient(90deg,transparent 43%,#262b28 44% 56%,transparent 57%),linear-gradient(0deg,#b4a483 43%,#262b28 44% 56%,#b4a483 57%);box-shadow:0 2px 3px #0008}
.fastener.nut::before{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:radial-gradient(circle,#252921 0 27%,#bcaa7b 30%)}
.fastener.slot::before{background:linear-gradient(0deg,#96865f 42%,#232721 43% 57%,#96865f 58%)}
.fastener.removed::before{width:12px;height:12px;background:#1a211d;border:1px solid #9a9d80}
.fastener.treated::before{animation:turn-fixing .26s ease-out}
@keyframes turn-fixing{from{transform:rotate(-120deg) scale(1.2)}to{transform:rotate(0)}}
#repairScene{user-select:none;min-height:205px}
#repairScene button{touch-action:none}
#repairScene button.dragging{z-index:5;pointer-events:none;transform:translate(var(--drag-x),var(--drag-y));cursor:grabbing}
#repairScene button.movable{cursor:grab}
#repairScene .fastener.turning{outline:2px solid var(--yellow);outline-offset:2px;background:conic-gradient(var(--yellow) var(--sweep),#1c241d var(--sweep))}
.fastener.turning::before,.fastener.partial::before{transform:rotate(var(--turn))}
#repairScene .fastener.partial{background:conic-gradient(var(--yellow) var(--sweep),#1c241d var(--sweep))}
#repairScene .drop-zone{position:absolute;z-index:4;display:grid;place-items:center;border:2px dashed #d6bf7b;border-radius:8px;color:#ffe8a8;font-size:.74rem;text-align:center;pointer-events:none}
#repairScene .drop-zone.ready{background:#6b573bcc;border-color:#fff0bc}
#repairScene .drop-zone[data-zone=open]{inset:10% auto 10% 4%;width:16%;writing-mode:vertical-rl}
#repairScene .drop-zone[data-zone=close]{inset:9% 14%}
#repairScene .drop-zone[data-zone=remove],#repairScene .drop-zone[data-zone=disconnect]{inset:22% 3% 22% auto;width:19%}
#repairScene .drop-zone[data-zone=install],#repairScene .drop-zone[data-zone=reconnect]{inset:24% 23% 24% 27%}
#repairScene #spare{bottom:3%;right:2%;width:22%;min-height:44px}
#toolHint{margin:0;font-size:.85rem}
@media(orientation:landscape) and (max-height:530px){
  #workbench{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
  #toolbox{align-content:center}
  #toolHint{grid-column:1/-1}
  #repairScene{min-height:160px}
}
@media(prefers-reduced-motion:reduce){#cover,.fastener::before{animation:none!important}}
#description{white-space:pre-line}
#message{min-height:1.5em;color:var(--yellow);margin:.7rem 0 0}
dialog{padding:0;border:0;background:none;max-height:calc(100% - 1.2rem);width:min(calc(100% - 1.2rem),33rem);color:inherit}
dialog::backdrop{background:#080c09b8}
dialog .panel{max-height:min(85dvh,46rem)}
@media(pointer:coarse){#stick{display:block}#action{left:auto;right:.8rem;transform:none;max-width:calc(100vw - 108px);overflow:hidden;text-overflow:ellipsis}#compass{bottom:5.6rem}}
#intro .panel{width:min(100%,58rem)}
#homeActions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 .5rem}
#homeStatus{margin:.5rem 0 0}
.mission-card:disabled{opacity:.65;cursor:default}
.mission-card:disabled:hover{border-color:var(--border)}
#missionList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:1.15rem}
.mission-card{text-align:left;display:grid;align-content:start;gap:.3rem;min-height:5rem}
.mission-card span{font-size:.78rem;color:#d1c7ae}
.mission-card strong{font-size:.96rem}
.mission-card:hover{border-color:var(--yellow)}
#rotate{z-index:2}
#rotate .panel{max-width:25rem}
@media(max-width:580px) and (orientation:portrait){#missionList{grid-template-columns:1fr}}
@media(orientation:landscape) and (max-height:530px){
  .overlay{padding:.5rem max(.5rem,env(safe-area-inset-right)) .5rem max(.5rem,env(safe-area-inset-left))}
  .panel{padding:.8rem 1rem}
  h1{font-size:clamp(2rem,7vh,3.2rem)}
  h2{font-size:1.35rem}
  p{margin:.4rem 0}
  #missionList{margin-top:.55rem;gap:.35rem}
  .mission-card{min-height:3.6rem;padding:.4rem .65rem}
  small{margin-top:.5rem}
  dialog{width:min(calc(100% - 2rem),42rem)}
  #choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem}
  #choices button{padding:.55rem .65rem}
  #message:empty{display:none}
  #compass{bottom:1rem}
  #action:not(:disabled){max-width:35vw}
}
@media(pointer:coarse){
  #top{left:max(.75rem,env(safe-area-inset-left));right:max(.75rem,env(safe-area-inset-right))}
  #stick{left:max(1rem,env(safe-area-inset-left))}
  #action{right:max(.8rem,env(safe-area-inset-right))}
}
</style>
</head>
<body>
<canvas id="view" aria-label="Lieu de la mission en 3D"></canvas>
<div id="hud" hidden>
  <div id="top"><div id="brief"><div class="brand" id="missionName"></div><strong id="goal"></strong></div><div id="toolbar"><button id="missionsButton">Accueil</button><button id="soundButton" type="button" aria-pressed="true">Son</button><button id="help" aria-label="Afficher les commandes">?</button></div></div>
  <span id="cross"></span><div id="compass"></div>
  <div id="stick" aria-label="Joystick de déplacement"><div id="thumb"></div></div>
  <button id="action" disabled>Interagir</button>
</div>
<div id="intro" class="overlay">
  <section class="panel">
    <div class="brand">FBA Games</div>
    <h1>Courant Coupé</h1>
    <div id="home">
      <div id="homeActions">
        <button id="playButton" class="primary">Jouer</button>
        <button id="continueButton" disabled>Continuer à jouer</button>
      </div>
      <p id="homeStatus"></p>
    </div>
    <section id="missionPicker" hidden aria-label="Choix des missions">
      <button id="backHome">Retour à l’accueil</button>
      <div id="missionList"></div>
    </section>
    <small>Sur téléphone, joue en mode paysage.</small>
    <p id="graphicsError" role="alert" hidden>Le rendu 3D est indisponible dans ce navigateur. Essaie un autre navigateur.</p>
  </section>
</div>
<div id="rotate" class="overlay" hidden>
  <section class="panel">
    <div class="brand">Courant Coupé</div>
    <h2>Tourne ton téléphone</h2>
    <p>Passe en mode paysage pour continuer la mission.</p>
  </section>
</div>
<dialog id="dialog"><section class="panel">
  <div class="brand" id="category"></div><h2 id="title"></h2><p id="description"></p>
  <div id="workbench" hidden>
    <div id="toolbox" role="group" aria-label="Mallette à outils"></div>
    <div id="repairScene" role="group" aria-label="Vue de près de l’équipement">
      <button id="component" type="button"></button>
      <button id="cover" type="button"></button>
      <button id="spare" type="button"></button>
      <div id="fasteners"></div>
      <div id="dropZone" class="drop-zone" hidden aria-hidden="true"></div>
    </div>
    <p id="toolHint" aria-live="polite"></p>
  </div>
  <section id="diagnostic" hidden aria-label="Tableau électrique interactif">
    <div id="meterControls">
      <button id="meterMode" type="button" aria-pressed="false">Prendre le voltmètre</button>
      <output id="meterDisplay" aria-live="polite">— V simulés</output>
    </div>
    <div id="probeTray" class="probe-tray" hidden aria-label="Pointes du voltmètre">
      <button id="blackProbe" type="button" class="probe black" aria-pressed="false">Pointe noire</button>
      <button id="redProbe" type="button" class="probe red" aria-pressed="false">Pointe rouge</button>
    </div>
    <span id="probeTip" hidden aria-hidden="true"></span>
    <div id="circuitRows"></div>
    <details id="notebook">
      <summary>Carnet d’intervention</summary>
      <p id="notebookReport"></p>
      <ul id="notebookReadings"></ul>
    </details>
  </section>
  <div id="choices"></div><p id="message" role="status"></p>
</section></dialog>
<script>
'use strict';
const get = id => document.getElementById(id);
const canvas = get('view');
const gl = canvas.getContext('webgl', {antialias:true, alpha:false});
const flat = gl ? null : canvas.getContext('2d', {alpha:false});
const modal = get('dialog');
const keys = new Set();
const camera = {x:0, z:2.2, yaw:0, pitch:0};
const missions = [
  {
    title:'La première fournée', place:'Boulangerie', client:'le boulanger', time:'05 h 42',
    report:'Dès que j’ai lancé la chauffe, le four s’est éteint. La vitrine et les lampes sont restées en service.',
    circuits:['Éclairage','Vitrine','Four'], fault:2, equipment:'Four de cuisson', short:'Four',
    repair:'Remplacer le module de chauffe',
    choices:['Remplacer la minuterie','Remplacer l’écran de commande'],
    win:'La fournée est sauvée', result:'Le four fonctionne à nouveau. Le boulanger peut lancer sa première fournée.',
    colors:['#9d9275','#5d5142','#85745c','#aa6a42']
  },
  {
    title:'Sous-sol dans le noir', place:'Parking souterrain', client:'le gardien', time:'21 h 18',
    report:'La barrière répond encore. Après le passage d’une voiture, toute la rangée de lampes de l’allée s’est éteinte.',
    circuits:['Éclairage','Ventilation','Barrière'], fault:0, equipment:'Armoire d’éclairage', short:'Armoire',
    repair:'Remplacer le relais d’éclairage',
    choices:['Remplacer le capteur de présence','Remplacer le moteur de la barrière'],
    win:'L’allée se rallume', result:'Les plafonniers éclairent à nouveau l’allée et les places de stationnement.',
    colors:['#667273','#4f575a','#647174','#d0a747']
  },
  {
    title:'Le rideau va se lever', place:'Salle de spectacle', client:'la régisseuse', time:'19 h 50',
    report:'Les balises restent allumées. Quand j’ai envoyé le premier effet, les projecteurs de la scène ont coupé.',
    circuits:['Sonorisation','Projecteurs','Balisage'], fault:1, equipment:'Rack des projecteurs', short:'Rack',
    repair:'Remplacer le module de puissance',
    choices:['Remplacer la console de son','Remplacer la batterie des balises'],
    win:'Place au spectacle', result:'Les projecteurs reprennent leur séquence. La régisseuse peut lancer le spectacle.',
    colors:['#65495b','#412c38','#634656','#8f4261']
  },
  {
    title:'Alerte au froid', place:'Entrepôt frigorifique', client:'la responsable', time:'04 h 26',
    report:'Les lampes sont restées allumées. Le groupe froid s’est arrêté et l’écran indique que la température remonte.',
    circuits:['Groupe froid','Éclairage','Quai'], fault:0, equipment:'Groupe frigorifique', short:'Groupe froid',
    repair:'Remplacer le ventilateur du condenseur',
    choices:['Remplacer le voyant de température','Remplacer la commande de quai'],
    win:'Le froid revient', result:'Le groupe frigorifique redémarre et la température commence à redescendre.',
    colors:['#769099','#536c75','#74909a','#589aaa']
  },
  {
    title:'Dernier départ', place:'Gare', client:'le chef de gare', time:'22 h 54',
    report:'Les lampes et les annonces fonctionnent. Les écrans de départ se sont tous figés juste avant le dernier train.',
    circuits:['Annonces','Éclairage','Affichage'], fault:2, equipment:'Baie d’affichage', short:'Affichage',
    repair:'Remplacer le contrôleur d’affichage',
    choices:['Remplacer l’amplificateur des annonces','Remplacer le programmateur d’éclairage'],
    win:'Départ affiché', result:'Les écrans indiquent le quai et l’heure du dernier train.',
    colors:['#78827b','#565c52','#83816b','#a78b49']
  }
];
const tools={
  cross:'Tournevis cruciforme',
  flat:'Tournevis plat',
  socket:'Clé à douille',
  hand:'Main',
  terminal:'Terminal de maintenance'
};
const procedures = [
  {
    panel:'Protection déclenchée lors de la demande de chauffe.',
    diagnosis:[
      ['Consulter le journal du four','La coupure correspond au démarrage de la chauffe. La minuterie et l’afficheur répondaient.'],
      ['Tester le module de chauffe hors tension','Le simulateur signale un défaut d’isolement sur le module de chauffe.']
    ],
    trial:'Lancer un cycle de préchauffage',
    result:'La température monte et la protection ne déclenche plus.'
  },
  {
    panel:'Protection enclenchée. Le retour d’état de l’allée reste éteint.',
    diagnosis:[
      ['Relire les événements du détecteur','Un passage est bien enregistré et la commande d’allumage est transmise.'],
      ['Contrôler le relais sur le banc de test','Le relais reçoit la commande simulée, mais son contact ne bascule pas.']
    ],
    trial:'Simuler un passage dans l’allée',
    result:'Les plafonniers s’allument au passage, puis s’éteignent après la temporisation de test.'
  },
  {
    panel:'Protection enclenchée. Le rack signale un défaut de sortie.',

// Pointer capture keeps a gesture active after the pointer leaves the part.
function bindGesture(button,{start,move,end,cancel,keyboard}){
  let active=null;
  function clear(event,finish){
    if(active!==event.pointerId) return;
    active=null;
    if(button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
    finish(event);
  }
  button.onpointerdown=event=>{
    if(button.disabled || event.button!==0 || event.isPrimary===false || active!==null || !start(event)) return;
    active=event.pointerId;
    button.setPointerCapture(active);
  };
  button.onpointermove=event=>{if(active===event.pointerId) move(event);};
  button.onpointerup=event=>clear(event,end);
  button.onpointercancel=event=>clear(event,cancel);
  button.onlostpointercapture=event=>clear(event,cancel);
  button.onclick=event=>{if(event.detail===0 && !button.disabled) keyboard();};
}
function screwGesture(button,clockwise,canUse,hint,finish){
  const fullTurn=Math.PI*2;
  let center,previous,rotation=0;
  function track(event){
    const x=event.clientX-center.x;
    const y=event.clientY-center.y;
    if(Math.hypot(x,y)<9){previous=null;return;}
    const angle=Math.atan2(y,x);
    if(previous!==null){
      const diff=angle-previous;
      const delta=Math.atan2(Math.sin(diff),Math.cos(diff));
      rotation=Math.min(fullTurn,Math.max(0,rotation+delta*(clockwise?1:-1)));
    }
    previous=angle;
    const degrees=Math.round(rotation*180/Math.PI);
    button.style.setProperty('--sweep',degrees+'deg');
    button.style.setProperty('--turn',degrees*(clockwise?1:-1)+'deg');
    hint.textContent=(clockwise?'Visser':'Dévisser')+' · '+Math.round(rotation/fullTurn*100)+' %';
  }
  bindGesture(button,{
    start:event=>{
      if(!canUse()) return false;
      const rect=button.getBoundingClientRect();
      center={x:rect.left+rect.width/2,y:rect.top+rect.height/2};
      previous=null;
      button.classList.add('turning');
      track(event);
      return true;
    },
    move:track,
    end:event=>{
      track(event);
      button.classList.remove('turning');
      button.classList.toggle('partial',rotation>0 && rotation<fullTurn-Math.PI/18);
      if(rotation>=fullTurn-Math.PI/18) finish();
      else hint.textContent='Maintiens et poursuis la rotation autour de la fixation.';
    },
    cancel:()=>{previous=null;button.classList.remove('turning');button.classList.toggle('partial',rotation>0);},
    keyboard:()=>{if(canUse()) finish();}
  });
}
function dragGesture(button,zone,canUse,hint,finish){
  let origin,drop;
  const inZone=event=>event.clientX>=drop.left && event.clientX<=drop.right
    && event.clientY>=drop.top && event.clientY<=drop.bottom;
  const reset=()=>{
    button.classList.remove('dragging');
    zone.classList.remove('ready');
  };
  bindGesture(button,{
    start:event=>{
      if(!canUse()) return false;
      origin={x:event.clientX,y:event.clientY};
      drop=zone.getBoundingClientRect();
      button.classList.add('dragging');
      return true;
    },
    move:event=>{
      button.style.setProperty('--drag-x',event.clientX-origin.x+'px');
      button.style.setProperty('--drag-y',event.clientY-origin.y+'px');
      zone.classList.toggle('ready',inZone(event));
    },
    end:event=>{
      reset();
      if(Math.hypot(event.clientX-origin.x,event.clientY-origin.y)>15 && inZone(event)) finish();
      else hint.textContent='Fais glisser la pièce jusque dans la zone en pointillés, puis relâche.';
    },
    cancel:reset,
    keyboard:()=>{if(canUse()) finish();}
  });
}

    button.type='button';
    button.className='fastener '+(step.shape || 'screw');
    const [left,top]=locations[index];
    button.style.left=left+'%';
    button.style.top=top+'%';
    const label=(step.shape==='nut'?'Écrou ':step.shape==='slot'?'Languette ':'Vis ')+(index+1);
    function markDone(){
      button.classList.add('treated');
      if(step.removing) button.classList.add('removed');
      button.disabled=true;
      button.setAttribute('aria-label',label+' traitée');
    }
    button.setAttribute('aria-label',label);
    if(showInactiveHoles){button.classList.add('removed');button.disabled=true;}
    else if(progress.fixings.has(index)) markDone();
    function finish(){
      if(progress.fixings.has(index)) return;
      progress.fixings.add(index);
      playSound(220,.065,.024,'triangle');
      markDone();
      if(progress.fixings.size===step.count) advance();

        hint.textContent=progress.fixings.size+' / '+step.count+' fixations traitées.';
        saveProgress();

    if(!button.disabled){

      else screwGesture(button,clockwise,()=>useTool(step.tool),hint,finish);
    }
    return button;
  });

  get('toolbox').replaceChildren(...buttons.map(([,button])=>button));

function equipment(feedback = ''){
  const procedure=procedures[missionIndex];
  if(progress.energized){
    if(progress.verified){
      openPanel(mission.place,'Essai réussi',procedure.result,[close]);
      return;
    }
    openPanel(mission.place,'Essai de fonctionnement','Vérifie que le symptôme a disparu dans les conditions de départ.',
      [[procedure.trial,()=>{
        progress.verified=true;
        playSound([145,210,440,112,620][missionIndex],.32,.046,'sine');
        updateObjective();
        equipment();
      },true],close]);
    return;
  }
  if(progress.fixed){
    openPanel(mission.place,'Réparation terminée','Retourne au tableau pour remettre le circuit en service.',[close],feedback);
    return;
  }
  if(!progress.secured){
    openPanel(mission.place,mission.equipment,'Sécurise le circuit au tableau avant d’intervenir.',[close]);
    return;
  }
  const notes=[...progress.checks].sort().map(index=>procedure.diagnosis[index][1]);
  if(progress.work>=0){
    repairBench(repairStepsForMission[progress.work],feedback);
    return;
  }
  const actions=procedure.diagnosis.flatMap(([label],index)=>progress.checks.has(index) ? [] : [
    [label,()=>{
      progress.checks.add(index);
      saveProgress();
      equipment();
    }]
  ]);
  if(progress.checks.size===procedure.diagnosis.length){
    const repairs=[...mission.choices];
    repairs.splice(mission.fault,0,mission.repair);
    actions.push(...repairs.map(label=>[label,()=>{
      if(label!==mission.repair){
        equipment('Cette pièce ne correspond pas aux résultats des contrôles.');
        return;
      }
      progress.work=0;
      progress.fixings.clear();
        selectedTool=null;
      saveProgress();
      equipment();
    }]));
  }
  openPanel(mission.place,mission.equipment,['Relève les indices sur l’équipement.',...notes].join('\n'),
    [...actions,close],feedback);
}

    varying mediump vec3 vWorld;
    void main(){
      vWorld=aVertex*uSize+uPosition;
      vec3 p = vWorld-uCamera;
      float x = p.x*uYaw.x+p.z*uYaw.y;
      float front = p.x*uYaw.y-p.z*uYaw.x;
      float y = p.y*uPitch.x-front*uPitch.y;
      float depth = p.y*uPitch.y+front*uPitch.x;
      gl_Position = vec4(x*uProjection.x,y*uProjection.y,1.004*depth-.16,depth);
      vShade=aShade;

    void main(){
      float ceilingPool = 1.0 - smoothstep(.1,3.2,length(vec2(vWorld.x,mod(vWorld.z+1.35,2.7)-1.35)));
      float brightness = .34 + .12/(1.0+vDepth*.16) + uLight*(.47+.21*ceilingPool);
      float surfaceGrain = .96 + .08*fract(sin(dot(floor(vWorld*55.),vec3(12.9,27.1,19.3)))*1963.4);
      vec3 color = uColor * mix(vShade*brightness*surfaceGrain,1.35,uGlow);
      gl_FragColor=vec4(mix(color,vec3(.15,.15,.12),smoothstep(7.,16.,vDepth)*.5),1.);
    }`));
  gl.linkProgram(program);

function renderWebGL(now){
  const scale = Math.min(window.devicePixelRatio || 1, 1.65);

  const height = Math.round(canvas.clientHeight*scale);
  if(canvas.width!==width || canvas.height!==height){

    gl.viewport(0,0,width,height);

  const sy = Math.sin(camera.yaw);

  gl.uniform3f(locations.Camera,camera.x,eyeHeight,camera.z);
  gl.uniform2f(locations.Yaw,cy,sy);
  gl.uniform2f(locations.Pitch,Math.cos(camera.pitch),Math.sin(camera.pitch));
  gl.uniform2f(locations.Projection,focal*height/width,focal);
  gl.uniform1f(locations.Light,light);
  for(const object of boxes){
    gl.uniform3f(locations.Position,object.x,object.y,object.z);
    gl.uniform3f(locations.Size,object.w,object.h,object.d);
    gl.uniform3fv(locations.Color,object.rgb);
    gl.uniform1f(locations.Glow,fixtureLight(object,light));

  const visible = [];
  for(let i=0;i<points.length;i++){
    const a=points[i];
    const b=points[(i+1)%points.length];
    if(a[2]>=.08) visible.push(a);
    if((a[2]>=.08)!==(b[2]>=.08)){

      visible.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),.08]);
    }
  }
  return visible;
}

      const x=object.x+vx*object.w/2-camera.x;
      const y=object.y+vy*object.h/2-eyeHeight;
      const z=object.z+vz*object.d/2-camera.z;
      const front=x*sy-z*cy;
      return [x*cy+z*sy,y*cp-front*sp,y*sp+front*cp];
    });
    for(const [indices,shade] of faces){
      const points=clipFace(indices.map(i=>vertices[i]));
      if(points.length<3) continue;
      const projected=points.map(([x,y,d])=>[width/2+x*focal/d,height/2-y*focal/d]);
      const area=projected.reduce((sum,[x,y],i)=>{
        const next=projected[(i+1)%projected.length];
        return sum+x*next[1]-y*next[0];
      },0);
      if(area>=0) continue;
      const depth=points.reduce((sum,p)=>sum+p[2],0)/points.length;
      const pool=1-Math.min(1,Math.hypot(object.x,object.z-2.7*Math.round(object.z/2.7))/3.2);
      const glow=fixtureLight(object,light);
      const brightness=shade*(.34+.12/(1+depth*.16)+light*(.47+.21*pool))*(1-glow)+1.35*glow;
      surfaces.push({projected,depth,color:'rgb('+object.rgb.map(value=>Math.round(value*brightness*255)).join(',')+')'});
    }
  }
  surfaces.sort((a,b)=>b.depth-a.depth);
  for(const {projected,color} of surfaces){
    flat.beginPath();
    flat.moveTo(...projected[0]);
    for(const point of projected.slice(1)) flat.lineTo(...point);
    flat.closePath();
    flat.fillStyle=color;
    flat.fill();
  }
}
let poweredAt;
function clearSpace(x,z){
  return Math.abs(x)<3.65 && Math.abs(z)<4.17 && colliders.every(object =>
    Math.abs(x-object.x)>object.w/2+.23 || Math.abs(z-object.z)>object.d/2+.23);
}
const pressed = (...names) => names.some(name => keys.has(name));
let eyeHeight=1.61;
let stride=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function move(delta){
  let forward = Number(pressed('z','w','arrowup'))-Number(pressed('s','arrowdown'));
  let side = Number(pressed('d'))-Number(pressed('q','a'));
  if(movementPad){forward-=movementPad.y;side+=movementPad.x;}
  const speed = 2.15*delta/Math.max(1,Math.hypot(forward,side));
  camera.yaw+=1.75*delta*(Number(pressed('arrowright'))-Number(pressed('arrowleft')));
  const x = speed*(Math.sin(camera.yaw)*forward+Math.cos(camera.yaw)*side);
  const z = speed*(-Math.cos(camera.yaw)*forward+Math.sin(camera.yaw)*side);
  const oldX=camera.x,oldZ=camera.z;
  if(clearSpace(camera.x+x,camera.z)) camera.x+=x;
  if(clearSpace(camera.x,camera.z+z)) camera.z+=z;
  const distance=Math.hypot(camera.x-oldX,camera.z-oldZ);
  if(distance>.001){
    const previous=Math.floor(stride/.59);
    stride+=distance;
    if(Math.floor(stride/.59)>previous) footstep();
  }
  const bob=distance>.001 && !reducedMotion.matches ? .025*Math.sin(stride*Math.PI*2/.59) : 0;
  eyeHeight+=(1.61+bob-eyeHeight)*Math.min(1,delta*14);
}
function relativeAngle(target){
  const angle = Math.atan2(target.x-camera.x,camera.z-target.z)-camera.yaw;
  return Math.atan2(Math.sin(angle),Math.cos(angle));
}
function updateHud(){
  const goal = targets.find(target => target.id===stage);
  const distance = target => Math.hypot(target.x-camera.x,target.z-camera.z);
  activeTarget = progress.powered ? null : targets.find(target =>
    distance(target)<2 && Math.abs(relativeAngle(target))<.54 &&
    Math.abs(Math.atan2(target.y-eyeHeight,distance(target))-camera.pitch)<.7);
  const action = get('action');
  action.disabled=!activeTarget;
  action.textContent=activeTarget?.name || 'Interagir';
  get('cross').style.background=activeTarget?'#ffca62':'transparent';
  get('compass').hidden=!goal;
  if(goal){
    const angle = relativeAngle(goal);
    const arrow = Math.abs(angle)<.38?'↑':angle>0?'→':'←';
    get('compass').textContent=arrow+' '+goal.short+' · '+Math.max(1,Math.round(distance(goal)))+' m';
  }
}
function frame(now){
  const delta = Math.min(.05,(now-frameTime)/1000);
  frameTime=now;
  if(progress.energized && poweredAt===undefined) poweredAt=now;
  if(started && !modal.open && !rotationBlocked){move(delta);updateHud();}
  if(gl) renderWebGL(now);
  else renderCanvas(now);
  requestAnimationFrame(frame);
}
function resetPad(){
  movementPad=null;
  get('thumb').style.transform='';
}
function padPosition(event){
  const rect=get('stick').getBoundingClientRect();
  const x=(event.clientX-rect.left-rect.width/2)/26;
  const y=(event.clientY-rect.top-rect.height/2)/26;
  const scale=Math.max(1,Math.hypot(x,y));
  movementPad.x=x/scale;
  movementPad.y=y/scale;
  get('thumb').style.transform='translate('+movementPad.x*25+'px,'+movementPad.y*25+'px)';
}
const pad=get('stick');
pad.onpointerdown=event=>{
  if(movementPad || rotationBlocked) return;
  movementPad={id:event.pointerId,x:0,y:0};
  pad.setPointerCapture(event.pointerId);
  padPosition(event);
};
pad.onpointermove=event=>{if(movementPad?.id===event.pointerId) padPosition(event);};
pad.onlostpointercapture=event=>{if(movementPad?.id===event.pointerId) resetPad();};
canvas.onpointerdown=event=>{
  if(!started || modal.open || rotationBlocked || look || event.button!==0) return;
  look={id:event.pointerId,x:event.clientX,y:event.clientY};
  canvas.setPointerCapture(event.pointerId);
};
canvas.onpointermove=event=>{
  if(look?.id!==event.pointerId) return;
  camera.yaw+=(event.clientX-look.x)*.006;
  camera.pitch=Math.max(-.75,Math.min(.75,camera.pitch-(event.clientY-look.y)*.005));
  look.x=event.clientX;
  look.y=event.clientY;
};
canvas.onlostpointercapture=event=>{if(look?.id===event.pointerId) look=null;};
window.addEventListener('keydown',event=>{
  if(!started || modal.open || rotationBlocked || event.altKey || event.ctrlKey || event.metaKey) return;
  const key=event.key.toLowerCase();
  if(key==='e'){
    if(!event.repeat) interact();
    return;
  }
  if(['z','w','s','a','q','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)){
    event.preventDefault();
    keys.add(key);
  }
});
window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();resetPad();look=null;});
let audioContext;
let ambientGain;
let ambientOscillator;
let stepBuffer;
let soundEnabled=true;
try{soundEnabled=localStorage.getItem('courant-coupe-sound')!=='off';}catch{}
function wakeAudio(){
  if(!soundEnabled) return;
  const AudioEngine=window.AudioContext || window.webkitAudioContext;
  if(!AudioEngine) return;
  try{
    if(!audioContext){
      audioContext=new AudioEngine();
      ambientGain=audioContext.createGain();
      ambientGain.gain.value=0;
      ambientGain.connect(audioContext.destination);
      ambientOscillator=audioContext.createOscillator();
      ambientOscillator.type='sine';
      ambientOscillator.connect(ambientGain);
      ambientOscillator.start();
      const length=Math.floor(audioContext.sampleRate*.11);
      stepBuffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
      const samples=stepBuffer.getChannelData(0);
      for(let i=0;i<length;i++) samples[i]=(Math.random()*2-1)*Math.pow(1-i/length,2.5);
    }
    if(audioContext.state==='suspended') void audioContext.resume().catch(()=>{});
  }catch{}
}
function updateAmbience(){
  if(!ambientGain) return;
  const t=audioContext.currentTime;
  const level=soundEnabled && started && !rotationBlocked && !document.hidden
    ? progress.energized ? .02 : .008 : 0;
  ambientOscillator.frequency.setTargetAtTime([83,47,67,55,112][missionIndex],t,.15);
  ambientGain.gain.setTargetAtTime(level,t,.15);
}
function playSound(frequency,duration,volume,type){
  if(!soundEnabled || audioContext?.state!=='running') return;
  const t=audioContext.currentTime;
  const voice=audioContext.createOscillator();
  const envelope=audioContext.createGain();
  voice.type=type;
  voice.frequency.value=frequency;
  envelope.gain.setValueAtTime(volume,t);
  envelope.gain.exponentialRampToValueAtTime(.001,t+duration);
  voice.connect(envelope);
  envelope.connect(audioContext.destination);
  voice.start(t);
  voice.stop(t+duration);
}
function footstep(){
  if(!soundEnabled || !stepBuffer || audioContext.state!=='running') return;
  const hit=audioContext.createBufferSource();
  hit.buffer=stepBuffer;
  const filter=audioContext.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=[420,820,310,580,680][missionIndex];
  const volume=audioContext.createGain();
  volume.gain.value=.12;
  hit.connect(filter);
  filter.connect(volume);
  volume.connect(audioContext.destination);
  hit.start();
}
const soundButton=get('soundButton');
function updateSoundButton(){
  soundButton.setAttribute('aria-pressed',String(soundEnabled));
  soundButton.textContent='Son';
  soundButton.setAttribute('aria-label',soundEnabled?'Couper le son':'Activer le son');
}
soundButton.onclick=()=>{
  soundEnabled=!soundEnabled;
  try{localStorage.setItem('courant-coupe-sound',soundEnabled?'on':'off');}catch{}
  wakeAudio();
  updateSoundButton();
  updateAmbience();
};
updateSoundButton();
get('action').onclick=interact;
get('help').onclick=()=>openPanel('Commandes','Se déplacer et interagir',
  'Clavier · ZQSD ou WASD pour marcher, flèches gauche/droite ou glissement à la souris pour tourner, E pour interagir. Tactile · joystick pour marcher, glissement dans la scène pour regarder, bouton d’action pour interagir. Suis la flèche pour trouver ton prochain objectif.',[close]);
let graphicsReady=Boolean(gl || flat);
let rotationBlocked=false;
let reopenPanel=false;
const portraitTouch=matchMedia('(orientation: portrait) and (pointer: coarse)');
function updateOrientation(){
  const blocked=started && portraitTouch.matches;
  if(blocked!==rotationBlocked){
    rotationBlocked=blocked;
    keys.clear();
    resetPad();
    look=null;
    if(blocked && modal.open){
      reopenPanel=true;
      modal.close();
    }
    if(!blocked && reopenPanel){
      reopenPanel=false;
      modal.showModal();
    }
  }else if(blocked && modal.open){
    reopenPanel=true;
    modal.close();
  }
  get('rotate').hidden=!blocked;
  get('hud').hidden=!started || blocked;
  updateAmbience();
}
portraitTouch.addEventListener('change',updateOrientation);
async function requestLandscape(){
  if(!matchMedia('(pointer: coarse)').matches || !screen.orientation?.lock) return;
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    await screen.orientation.lock('landscape');
  }catch{}
}
function renderMissionList(){
  const list=get('missionList');
  list.replaceChildren(...missions.map((item,index)=>{
    const button=document.createElement('button');
    const place=document.createElement('span');
    const title=document.createElement('strong');
    button.className='mission-card';
    const status=completed.has(index) ? 'Réussie' : unlocked(index) ? 'Disponible' : '🔒 Verrouillée';
    place.textContent=item.place+' · '+status;
    title.textContent=item.title;
    button.append(title,place);
    button.disabled=!graphicsReady || !unlocked(index);
    button.onclick=()=>{
      startMission(index);
      void requestLandscape();
    };
    return button;
  }));
}
function nextUnfinished(){
  return missions.findIndex((_,index)=>unlocked(index) && !completed.has(index));
}
function updateHome(){
  const resumeIndex=checkpoint?.index ?? nextUnfinished();
  get('playButton').disabled=!graphicsReady;
  get('continueButton').disabled=!graphicsReady || resumeIndex<0 || (!checkpoint && !completed.size);
  get('homeStatus').textContent=checkpoint ? 'Mission en cours · '+missions[checkpoint.index].title
    : completed.size ? completed.size+' / '+missions.length+' missions réussies' : '';
}
function showMenu(picker=false){
  saveProgress();
  clearTimeout(successTimer);
  started=false;
  reopenPanel=false;
  if(modal.open) modal.close();
  get('intro').hidden=false;
  get('home').hidden=picker;
  get('missionPicker').hidden=!picker;
  if(picker) renderMissionList();
  else updateHome();
  updateOrientation();
  if(!picker) get('playButton').focus();
}
function startMission(index,resume=null){
  if(!graphicsReady || !unlocked(index)) return;
  clearTimeout(successTimer);
  if(modal.open) modal.close();
  reopenPanel=false;
  missionIndex=index;
  mission=missions[index];
  const interview=resume?.interview===true;
  const tests=new Set(interview && Array.isArray(resume?.tests)
    ? resume.tests.filter(test=>Number.isInteger(test) && test>=0 && test<mission.circuits.length) : []);
  const isolated=tests.size===mission.circuits.length && resume?.isolated===true;
  const procedure=procedures[index];
  const fixed=isolated && resume?.fixed===true;
  const secured=isolated && (fixed || resume?.secured===true);
  const checks=new Set(secured && Array.isArray(resume?.checks)
    ? resume.checks.filter(check=>Number.isInteger(check) && check>=0 && check<procedure.diagnosis.length) : []);
  repairStepsForMission=repairSteps(index);
  const savedWork=checks.size===procedure.diagnosis.length && Number.isInteger(resume?.work) && resume.work>=0;
  const work=fixed ? repairStepsForMission.length : savedWork
    ? resume.repairVersion===2 ? Math.min(resume.work,repairStepsForMission.length-1) : 0
    : -1;
  const energized=fixed && resume?.energized===true;
  const fixings=new Set(work>=0 && !fixed && resume.repairVersion===2 && Array.isArray(resume.fixings)
    ? resume.fixings.filter(fixing=>Number.isInteger(fixing) && fixing>=0 && fixing<repairStepsForMission[work].count) : []);
  progress={interview,tests,isolated,secured,checks,work,fixings,fixed,energized,verified:energized && resume?.verified===true,powered:false};
  selectedTool=null;
  meterInHand=false;
  resetProbes();
  get('meterDisplay').textContent='— V simulés';
  get('notebook').open=false;
  poweredAt=undefined;
  eyeHeight=1.61;
  stride=0;
  wakeAudio();
  keys.clear();
  resetPad();
  look=null;
  Object.assign(camera,{x:0,z:2.2,yaw:0,pitch:0});
  const contact=mission.client.startsWith('le ')?'au '+mission.client.slice(3):'à '+mission.client;
  Object.assign(targets[0],{name:'Parler '+contact,short:mission.client});
  Object.assign(targets[2],{name:'Examiner · '+mission.short,short:mission.short});
  buildScene();
  const position=resume?.camera;
  if(position && [position.x,position.z,position.yaw,position.pitch].every(Number.isFinite)
    && clearSpace(position.x,position.z) && Math.abs(position.pitch)<=.75){
    Object.assign(camera,position);
  }
  started=true;
  get('intro').hidden=true;
  get('missionName').textContent='Mission '+String(index+1).padStart(2,'0')+' · '+mission.time;
  updateObjective();
  updateHud();
  updateOrientation();
}
get('missionsButton').onclick=()=>showMenu();
get('playButton').onclick=()=>showMenu(true);
get('backHome').onclick=()=>showMenu();
get('continueButton').onclick=()=>{
  startMission(checkpoint?.index ?? nextUnfinished(),checkpoint);
  void requestLandscape();
};
window.addEventListener('pagehide',saveProgress);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') saveProgress();
  updateAmbience();
});
progress={powered:false};
updateHome();
buildScene();
try{
  if(!gl && !flat) throw new Error('Canvas indisponible');
  if(gl) setupGraphics();
  requestAnimationFrame(frame);
}catch(error){
  console.error(error);
  get('graphicsError').hidden=false;
  graphicsReady=false;
  updateHome();
}
</script>
